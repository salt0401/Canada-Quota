name: Retry failed TRQ update

# When "Weekly Canada TRQ Update" fails, the usual cause is the source host
# (www.eics-scei.gc.ca) silently dropping this runner's egress IP — a transient,
# IP-specific block (see docs/known-issues.md). Re-running provisions a NEW runner
# with a different egress IP, which normally succeeds. This workflow does that
# automatically, capped via run_attempt so it can never loop forever.
on:
  workflow_run:
    workflows: ["Weekly Canada TRQ Update"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun-on-fresh-runner:
    # Only on a genuine failure, and stop after a few attempts. run_attempt is 1
    # on the first failure, 2 after the first auto-retry, etc. < 3 => up to two
    # automatic retries before giving up and leaving the failure (and its email).
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Wait, then re-run on a fresh runner (new egress IP)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Run ${{ github.event.workflow_run.id }} failed on attempt ${{ github.event.workflow_run.run_attempt }}."
          echo "Backing off before re-running on a new runner (new egress IP)..."
          sleep 60
          gh run rerun ${{ github.event.workflow_run.id }} --failed --repo "${{ github.repository }}"
