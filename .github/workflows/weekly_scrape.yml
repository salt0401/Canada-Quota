name: Weekly Canada TRQ Update

# ============================================================================
# SCHEDULE DISABLED 2026-08-02 - the weekly run moved to the MEPS company
# server (WIN-RE1UH50A07U), scheduled task "MEPS Canada TRQ Weekly Update",
# Mondays 13:00 local. See docs/SERVER_DEPLOYMENT.md.
#
# This workflow is KEPT, and workflow_dispatch is KEPT, as the emergency
# fallback. It is not dead code:
#
#   * If the server is down or its task is broken, "Run workflow" publishes
#     from a GitHub runner exactly as before.
#   * More importantly, it is the ONLY escape hatch from known-issues.md Bug 3.
#     www.eics-scei.gc.ca silently drops TCP connections from some datacenter
#     egress IPs. GitHub rotates runner IPs, so a bad draw self-heals on
#     re-run; the company server has ONE fixed IONOS address and no such
#     escape. If the source ever starts refusing 212.227.127.169, dispatching
#     this workflow draws a different IP and is the way to get the week's data
#     out. (Measured 2026-08-02: all four source URLs return 200 from the
#     server. That is a snapshot, not a guarantee.)
#
# WARNING - the cutover trap. Never dispatch this while the server task is
# armed and has not yet failed for the week. Two hosts publishing the same week
# race on `git push`; the server's task deliberately does NOT auto-resolve a
# rebase conflict on the binary workbook, so one of the two runs fails loudly
# and a week of history could be lost to a blind merge. Confirm the server task
# did not run (or failed) first.
#
# To re-arm the cloud schedule, uncomment the two lines below AND disable the
# server task - never both.
# ============================================================================
on:
  # schedule:
  #   - cron: '0 12 * * 1'    # Every Monday at 12:00 UTC (~7-8 AM ET depending on DST)
  workflow_dispatch:          # Manual trigger - the emergency fallback

permissions:
  contents: write

# Never let a manual dispatch overlap the scheduled run or an in-flight
# auto-retry: overlapping jobs would race on `git push`.
# Known trade-off: GitHub keeps only ONE pending run per group — if a retry
# attempt is queued and another run queues after it, the pending retry is
# cancelled (conclusion 'cancelled', which retry_on_failure.yml ignores) and
# the superseding run does the same work instead. Acceptable for a weekly cron.
concurrency:
  group: weekly-trq-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # normal run ~25s; IP-block runs ~5m. A hang must not stall the auto-retry for 6h.
    steps:
      # ref: master (not the default frozen github.sha) so auto-retry reruns
      # see commits pushed by earlier attempts. Without it, a run that pushed
      # data but failed later (e.g. at the Release step) dooms every rerun to
      # a non-fast-forward push rejection. With it, the rerun's same-day
      # idempotency skips the duplicate date column; the re-saved workbook
      # still differs byte-wise (openpyxl re-serialization), so the rerun
      # pushes a small harmless fast-forward churn commit and the Release
      # step then succeeds.
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - run: python canada_trq_tracker.py

      - name: Commit updated data
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Weekly TRQ update $(date +%Y-%m-%d)"
          git push

      - name: Update GitHub Release with latest Excel
        # Third-party action holding a write token: pinned to a commit SHA so a
        # moved tag can't silently swap the code. SHA = tag v2 (2026-07).
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: latest
          name: Latest TRQ Data
          body: "Weekly TRQ data update. Download the Excel file below."
          files: data/canada_trq_tracker.xlsx
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
