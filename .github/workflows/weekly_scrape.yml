name: Weekly Canada TRQ Update
on:
  schedule:
    - cron: '0 12 * * 1'    # Every Monday at 12:00 UTC (~7-8 AM ET depending on DST)
  workflow_dispatch:          # Manual trigger

permissions:
  contents: write

# Never let a manual dispatch overlap the scheduled run or an in-flight
# auto-retry: overlapping jobs would race on `git push`.
# Known trade-off: GitHub keeps only ONE pending run per group — if a retry
# attempt is queued and another run queues after it, the pending retry is
# cancelled (conclusion 'cancelled', which retry_on_failure.yml ignores) and
# the superseding run does the same work instead. Acceptable for a weekly cron.
concurrency:
  group: weekly-trq-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # normal run ~25s; IP-block runs ~5m. A hang must not stall the auto-retry for 6h.
    steps:
      # ref: master (not the default frozen github.sha) so auto-retry reruns
      # see commits pushed by earlier attempts. Without it, a run that pushed
      # data but failed later (e.g. at the Release step) dooms every rerun to
      # a non-fast-forward push rejection. With it, the rerun's same-day
      # idempotency skips the duplicate date column; the re-saved workbook
      # still differs byte-wise (openpyxl re-serialization), so the rerun
      # pushes a small harmless fast-forward churn commit and the Release
      # step then succeeds.
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - run: python canada_trq_tracker.py

      - name: Commit updated data
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Weekly TRQ update $(date +%Y-%m-%d)"
          git push

      - name: Update GitHub Release with latest Excel
        # Third-party action holding a write token: pinned to a commit SHA so a
        # moved tag can't silently swap the code. SHA = tag v2 (2026-07).
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: latest
          name: Latest TRQ Data
          body: "Weekly TRQ data update. Download the Excel file below."
          files: data/canada_trq_tracker.xlsx
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
